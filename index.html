<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Aplicação web IPTV para Chrome e Safari">
  <title>IPTV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <main id="loginView" class="login-shell">
    <form id="loginForm" class="login-card">
      <h1>Acesso</h1>
      <p class="muted">Introduz o endereço completo da tua lista M3U.</p>
      <label>Endereço da lista M3U<input id="playlistUrl" type="url" placeholder="https://servidor/lista.m3u" autocomplete="url" required></label>
      <label class="remember"><input id="remember" type="checkbox"> Guardar o endereço neste dispositivo</label>
      <button id="loginButton" class="primary" type="submit">Entrar</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </main>

  <main id="appView" class="app-shell hidden">
    <header class="topbar">
      <div><div class="eyebrow">BIBLIOTECA</div><h1 id="pageTitle">Início</h1></div>
      <button id="logoutButton" class="quiet" type="button">Terminar sessão</button>
    </header>
    <nav class="tabs" aria-label="Secções">
      <button data-section="home" class="tab active">Início</button>
      <button data-section="live" class="tab">Canais</button>
      <button data-section="movie" class="tab">Filmes</button>
      <button data-section="series" class="tab">Séries</button>
    </nav>
    <section id="homePanel" class="home-panel">
      <h2>O que queres ver?</h2>
      <p class="muted">Escolhe Canais para consultar a lista M3U.</p>
      <div class="quick-grid">
        <button data-section="live" class="quick">Canais <span>TV</span></button>
        <button data-section="movie" class="quick">Filmes <span>FILM</span></button>
        <button data-section="series" class="quick">Séries <span>PLAY</span></button>
      </div>
      <p id="accountInfo" class="muted small"></p>
    </section>
    <section id="catalogPanel" class="hidden">
      <div class="catalog-tools">
        <input id="search" type="search" placeholder="Pesquisar conteúdos…">
        <select id="categorySelect" aria-label="Categoria"><option value="">Todos os grupos</option></select>
      </div>
      <p id="status" class="muted" aria-live="polite"></p>
      <div id="items" class="items-grid"></div>
    </section>
  </main>

  <dialog id="playerDialog" class="player-dialog">
    <div class="player-head"><strong id="playerTitle">Reprodução</strong><button id="closePlayer" class="quiet" type="button">Fechar ✕</button></div>
    <video id="video" controls playsinline autoplay></video>
    <p id="playerMessage" class="muted small"></p>
  </dialog>

  <dialog id="seriesDialog" class="detail-dialog">
    <div class="player-head"><strong id="seriesTitle">Detalhes da série</strong><button id="closeSeries" class="quiet" type="button">Fechar ✕</button></div>
    <div id="episodes" class="episodes"></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
